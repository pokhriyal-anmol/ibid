name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No source texts in git
        run: |
          bad=$(git ls-files | grep -i -E '\.pdf$|^data/raw/' || true)
          if [ -n "$bad" ]; then echo "Source texts must not be committed:"; echo "$bad"; exit 1; fi

      - name: Frozen gold matches its pin
        run: |
          for pin in gold/v[0-9]*.sha256; do
            file="${pin%.sha256}.json"
            want=$(tr -d ' \n' < "$pin")
            got=$(sha256sum "$file" | cut -d' ' -f1)
            if [ "$want" != "$got" ]; then echo "$file does not match $pin"; exit 1; fi
            echo "$file matches its pin"
          done

      - uses: astral-sh/setup-uv@v5

      - name: Compile
        run: uv run --python 3.12 python -m compileall -q src

      - name: Poppler tools
        run: sudo apt-get install -y poppler-utils

      - uses: actions/cache@v4
        with:
          path: data/raw
          key: raw-${{ hashFiles('data/sources.json') }}

      # Each fetch checks the pinned sha256 and never overwrites. `ibid setup` exits 1 here because the
      # IPC PDF is missing (signed, expiring WIPO link), so the exit code is ignored; a failed fetch
      # leaves a PDF absent and the tests that need it fail. IPC tests skip (tests/pdfs.py needs_ipc).
      - name: Fetch the source PDFs CI can reach
        run: |
          for s in bns bnss crpc bnss_crpc_table; do uv run --python 3.12 ibid setup --fetch "$s" || true; done

      - name: Tests
        run: uv run --python 3.12 python -m unittest discover -s tests
