[project]
name = "ibid"
version = "0.1.0"
description = "Deterministic retrieval of Indian criminal statute with exact citations"
requires-python = ">=3.11"
license = { file = "LICENSE" }
classifiers = ["License :: Other/Proprietary License"]
dependencies = []

[project.scripts]
ibid = "ibid.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ibid"]
